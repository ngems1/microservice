# Default values for onlineboutique.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

images:
  repository: gcr.io/google-samples/microservices-demo
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

serviceAccounts:
  # Specifies whether service accounts should be created.
  create: false
  # Annotations to add to the service accounts.
  annotations: {}
  # Annotations to add only for the cartservice app. This allows to follow the least privilege principle where only cartservice needs to connect to external database for example via Workload Identity.
  annotationsOnlyForCartservice: false

networkPolicies:
  # Specifies if the NetworkPolicies are created or not. If true, one fine granular NetworkPolicy per app is created.
  create: false

sidecars:
  # Specifies if the Sidecars are created or not. If true, one fine granular Sidecar per app is created.
  create: false

authorizationPolicies:
  # Specifies if the AuthorizationPolicies are created or not. If true, one fine granular AuthorizationPolicy per app is created.
  create: false

opentelemetryCollector:
  create: false
  name: opentelemetrycollector
  # Specifies the project id for the otel collector. If set as "PROJECT_ID" (default value), an initContainer will automatically retrieve the project id value from the metadata server.
  projectId: "PROJECT_ID"

googleCloudOperations:
  profiler: false
  tracing: false
  metrics: false

seccompProfile:
  enable: false
  type: RuntimeDefault

adService:
  create: true
  name: adservice
  resources:
    requests:
      cpu: 200m
      memory: 180Mi
    limits:
      cpu: 1000m      # Week 3: was 300m, too little for the JVM to start in time
      memory: 512Mi   # Week 3: was 300Mi (Java 21 runtime)

cartService:
  create: true
  name: cartservice
  resources:
    requests:
      cpu: 200m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 128Mi

checkoutService:
  create: true
  name: checkoutservice
  # Week 3: order persistence + OrderCreated. Off while eventBusName is empty
  # (local runs); the deploy workflow fills these from Terraform on AWS.
  orders:
    awsRegion: us-east-1
    eventBusName: ""
    dbHost: ""
    dbPort: 3306
    dbName: ""
    dbSecretArn: ""
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

currencyService:
  create: true
  name: currencyservice
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

emailService:
  create: true
  name: emailservice
  # Week 3: notification consumer. Empty = off (stock Online Boutique behaviour);
  # the deploy workflow fills these from Terraform.
  notifications:
    awsRegion: us-east-1
    queueUrl: ""     # SQS notification-q URL
    tableName: ""    # DynamoDB notifications table
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

inventoryService:
  # Week 3 addition. Off by default so the stock Online Boutique install still works;
  # turned on in values-aws.yaml; the deploy workflow adds the AWS names from Terraform.
  create: false
  name: inventoryservice
  replicas: 1
  awsRegion: us-east-1
  tableName: ""      # DynamoDB table, e.g. week3-boutique-dev-inventory
  queueUrl: ""       # SQS inventory-q URL
  eventBusName: ""   # EventBridge bus, e.g. week3-boutique-dev-events
  seedStock: true    # create stock rows for the 9 catalog products if missing
  defaultStock: 50
  stockOverrides: "6E92ZMYYFZ:2"  # Mug starts at 2, so a 3-mug order shows InventoryFailed
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 192Mi

frontend:
  create: true
  name: frontend
  externalService: true
  cymbalBranding: false
  # One of: local, gcp, aws, azure, onprem, alibaba. When not set, defaults to "local" unless running in GKE, otherwise auto-sets to gcp.
  platform: local
  singleSharedSession: false
  # AWS: an Ingress for the AWS Load Balancer Controller, which creates one
  # internet-facing ALB per environment (templates/ingress.yaml).
  ingress:
    enabled: false
    className: alb
    # The ALB sends traffic and health checks straight to the pod IPs (target-type ip),
    # so the frontend NetworkPolicy lets in this range: the VPC.
    allowFromCidr: 10.0.0.0/16
    annotations: {}
  virtualService:
    create: false
    hosts:
    - "*"
    gateway:
      name: asm-ingressgateway
      namespace: asm-ingress
      labelKey: asm
      labelValue: ingressgateway
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

loadGenerator:
  create: true
  name: loadgenerator
  checkFrontendInitContainer: true
  resources:
    requests:
      cpu: 300m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

paymentService:
  create: true
  name: paymentservice
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

productCatalogService:
  create: true
  name: productcatalogservice
  # Specifies an extra latency to any request on productcatalogservice, by default no extra latency.
  extraLatency: ""
  # Week 3: catalog from RDS MySQL with a Redis cache. Empty dbSecretArn = products.json
  # only (stock Online Boutique behaviour); the deploy workflow fills these from Terraform.
  catalog:
    awsRegion: us-east-1
    dbHost: ""
    dbPort: "3306"
    dbName: ""
    dbSecretArn: ""
    redisAddr: ""     # ElastiCache endpoint host:port (same cluster as the carts)
    cacheTtl: 5m      # how long a catalog read from MySQL stays in Redis
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

recommendationService:
  create: true
  name: recommendationservice
  resources:
    requests:
      cpu: 100m
      memory: 220Mi
    limits:
      cpu: 200m
      memory: 450Mi

shippingService:
  create: true
  name: shippingservice
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

cartDatabase:
  # Specifies the type of the cartservice's database, could be either redis or spanner.
  type: redis
  connectionString: "redis-cart:6379"
  inClusterRedis:
    create: true
    name: redis-cart
    # Uses the public redis image from Docker Hub, otherwise will use the images.repository.
    publicRepository: true
  externalRedisTlsOrigination:
    enable: false
    name: exernal-redis-tls-origination
    endpointAddress: ""
    endpointPort: ""
    certificate: ""
